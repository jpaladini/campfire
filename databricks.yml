# Campfire — team check-in Databricks App.
# One target per workspace; this file and src/app.yaml are byte-identical
# across environments. The ONLY per-environment difference is secret VALUES
# in each workspace's `campfire` secret scope (see README).
bundle:
  name: campfire

targets:
  dev:  { mode: development, default: true }  # dev mode = name-prefixed, per-user isolated
  stg:  { mode: production }
  prod: { mode: production }

resources:
  apps:
    campfire:
      name: campfire
      description: "Team wins & losses check-in with AI digest"
      source_code_path: ./src
      # Delta-backed persistence (optional): create the per-workspace secret
      # first (databricks secrets create-scope campfire && databricks secrets
      # put-secret campfire warehouse_id --string-value <id>, then put-acl for
      # the pipeline SP), and uncomment this block plus the matching
      # CAMPFIRE_WAREHOUSE_ID env in src/app.yaml. Without it the app uses an
      # ephemeral local store (entries lost on app restart).
      # resources:
      #   - name: campfire_warehouse_id
      #     secret: { scope: campfire, key: warehouse_id, permission: READ }
