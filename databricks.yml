# Campfire — team check-in Databricks App.
# One target per workspace; this file and src/app.yaml are byte-identical
# across environments. The ONLY per-environment difference is secret VALUES
# in each workspace's `campfire` secret scope (see README, incl. the
# put-acl the PIPELINE service principal needs on that scope).
bundle:
  name: campfire

targets:
  dev:  { mode: development, default: true }  # dev mode = name-prefixed, per-user isolated
  stg:  { mode: production }
  prod: { mode: production }

resources:
  jobs:
    campfire_digest_job:
      name: campfire-weekly-digest
      # Monday 06:00 UTC. The in-app "Digest lands on" setting is a per-user
      # display preference; the team-wide pin lands on this cron.
      schedule: { quartz_cron_expression: "0 0 6 ? * MON", timezone_id: UTC, pause_status: UNPAUSED }
      tasks:
        - task_key: generate_digest
          environment_key: default
          spark_python_task:
            python_file: ./jobs/generate_digest.py
            parameters: ["main.default", "databricks-claude-sonnet-4-5"]
      environments:
        - environment_key: default
          spec: { client: "2" }

  apps:
    campfire:
      name: campfire
      description: "Team wins & losses check-in with AI digest"
      source_code_path: ./src
      resources:
        # Named secret resources — referenced by `valueFrom:` in src/app.yaml.
        # Required per-workspace secrets (scope `campfire`):
        #   warehouse_id — SQL warehouse backing the Delta tables
        #   ado_pat      — Code(Read) PAT for the Now Shipping sync
        - name: campfire_warehouse_id
          secret: { scope: campfire, key: warehouse_id, permission: READ }
        - name: campfire_ado_pat
          secret: { scope: campfire, key: ado_pat, permission: READ }
