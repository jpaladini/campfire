command: ["python", "serve.py"]
env:
  # Foundation Model serving endpoint used for cleanup + digest.
  # Identical across environments; the app authenticates as its own
  # service principal (injected by Databricks Apps).
  - name: SERVING_ENDPOINT
    value: databricks-claude-sonnet-4-5
  # SQL warehouse that backs the entries/settings Delta tables (optional —
  # unset means ephemeral local storage). To enable, uncomment together with
  # the secret resource in databricks.yml. valueFrom references the bundle
  # resource NAME, NOT a "scope/key" string.
  # - name: CAMPFIRE_WAREHOUSE_ID
  #   valueFrom: campfire_warehouse_id
  # Catalog.schema for the app tables.
  - name: CAMPFIRE_SCHEMA
    value: main.default
